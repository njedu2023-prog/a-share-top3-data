name: Monitor WP Data

on:
  # WP-specific automatic and push-triggered runs paused 2026-08-14 by user request.
  # Deliberate one-off runs remain available from the Actions UI.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wp-data-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check and repair WP upstream freshness
        run: python scripts/wp/monitor_wp_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_DATA_MONITOR_MAX_AGE_MIN: "18"
          WP_DATA_MONITOR_SESSION_GRACE_MIN: "15"
