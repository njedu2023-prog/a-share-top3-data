name: Monitor WP Data

on:
  workflow_dispatch:
  schedule:
    # Exact Beijing trading windows converted to UTC.
    - cron: "25,35,45,55 1 * * 1-5"
    - cron: "5,15,25,35,45,55 2 * * 1-5"
    - cron: "5,15,25,35 3 * * 1-5"
    - cron: "55 4 * * 1-5"
    - cron: "5,15,25,35,45,55 5,6 * * 1-5"
    - cron: "5,10 7 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: wp-data-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check and repair WP upstream freshness
        run: python scripts/wp/monitor_wp_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_DATA_MONITOR_MAX_AGE_MIN: "25"
          WP_DATA_MONITOR_SESSION_GRACE_MIN: "25"
