name: Daily Data Fetch

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Override trade date YYYYMMDD (optional)"
        required: false
        default: ""

  schedule:
    # 周一到周五：北京时间 17:00 / 17:30 / 18:00
    # GitHub cron 使用 UTC（北京时间 = UTC+8）
    - cron: "0 9 * * 1-5"   # UTC 09:00 = 北京 17:00
    - cron: "30 9 * * 1-5"  # UTC 09:30 = 北京 17:30
    - cron: "0 10 * * 1-5"  # UTC 10:00 = 北京 18:00

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: daily-data-fetch-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -e
          if [ -z "${TUSHARE_TOKEN}" ]; then
            echo "ERROR: TUSHARE_TOKEN is empty or not configured."
            exit 1
          fi
          echo "TUSHARE_TOKEN is configured."

      - name: Fetch snapshots
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          ENABLE_DRAGON_TIGER: "0"
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "80"
          TRADE_DATE: ${{ inputs.trade_date || '' }}
        run: |
          set -e
          python scripts/fetch_daily_snapshots.py

      - name: Build limit stage snapshot
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TRADE_DATE: ${{ inputs.trade_date || '' }}
        run: |
          set -e
          python scripts/build_limit_stage.py

      - name: Commit and push data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status --short

          if [ -d data/raw ]; then
            git add data/raw
          else
            echo "WARN: data/raw directory does not exist."
          fi

          if [ -d data/latest ]; then
            git add data/latest
          else
            echo "WARN: data/latest directory does not exist, skip."
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: update snapshots"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push data after 3 attempts."
          exit 1
