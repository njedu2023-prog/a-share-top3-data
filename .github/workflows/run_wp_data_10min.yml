name: Run WP Data 10min

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fetch_daily_snapshots.py
      - scripts/wp/wp_pipeline.py
      - scripts/wp/run_wp_data_session.py
      - scripts/wp/trigger_wp_data.txt
      - .github/workflows/run_wp_data_10min.yml
  schedule:
    # Beijing A-share trading windows, expressed in UTC.
    - cron: "25,35,45,55 1 * * 1-5"
    - cron: "5,15,25,35,45,55 2 * * 1-5"
    - cron: "5,15,25,35 3 * * 1-5"
    - cron: "55 4 * * 1-5"
    - cron: "5,15,25,35,45,55 5,6 * * 1-5"
    - cron: "5,10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: wp-data-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run WP data update
        run: python scripts/wp/run_wp_data_session.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          REALTIME_MINUTE_ONLY: "1"
          ENABLE_MARKET_MINUTE_SCAN: "1"
          TRY_FULL_MARKET_MINUTE: "0"
          REALTIME_QUOTE_CHUNK_SIZE: "300"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "6000"
          WP_INTRADAY_MIN_PCT: "8"
          WP_DATA_RUN_MODE: "once"
          WP_SCHEDULE_GRACE_SECONDS: "600"
          WP_SESSION_INTERVAL_SECONDS: "600"
