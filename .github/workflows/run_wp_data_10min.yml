name: Run WP Data 10min

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fetch_daily_snapshots.py
      - scripts/wp/wp_pipeline.py
      - scripts/wp/run_wp_data_session.py
      - .github/workflows/run_wp_data_10min.yml
  schedule:
    # Beijing time startup guards: 09:05/09:15/09:25 and 12:35/12:45/12:55.
    # The runner then loops every 10 minutes inside the A-share trading window.
    - cron: "5,15,25 1 * * 1-5"
    - cron: "35,45,55 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: wp-data-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run WP data session
        run: python scripts/wp/run_wp_data_session.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          REALTIME_MINUTE_ONLY: "1"
          ENABLE_MARKET_MINUTE_SCAN: "1"
          TRY_FULL_MARKET_MINUTE: "0"
          REALTIME_QUOTE_CHUNK_SIZE: "300"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "6000"
          WP_INTRADAY_MIN_PCT: "8"
          WP_SESSION_INTERVAL_SECONDS: "600"
