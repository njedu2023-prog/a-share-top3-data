name: Run WP Data 10min

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fetch_daily_snapshots.py
      - scripts/wp/wp_pipeline.py
      - .github/workflows/run_wp_data_10min.yml
  schedule:
    # Check every 5 minutes during weekdays. The Python guard below enforces
    # the A-share calendar/window and skips when WP data is still fresh.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: wp-data-10min
  cancel-in-progress: false

jobs:
  wp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize run flag
        run: echo "RUN_WP=1" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check A-share run window
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import os
          import csv
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import tushare as ts

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.strftime("%Y%m%d")
          in_time = time(9, 25) <= now.time() <= time(11, 35) or time(12, 55) <= now.time() <= time(15, 10)

          ts.set_token(os.environ["TUSHARE_TOKEN"])
          pro = ts.pro_api()
          cal = pro.trade_cal(exchange="SSE", start_date=today, end_date=today)
          in_day = bool(len(cal) and int(cal.iloc[0].get("is_open", 0)) == 1)

          if not (in_day and in_time):
              print(f"Skip outside A-share trading calendar/window: {now:%Y-%m-%d %H:%M:%S}, in_day={in_day}, in_time={in_time}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("RUN_WP=0\n")
              raise SystemExit(0)

          fresh_minutes = float(os.environ.get("WP_FRESH_MINUTES", "8"))
          candidates = [
              Path(f"data/wp/reports_input/{today[:4]}/{today}/wp_rank_input.csv"),
              Path("data/wp/latest/wp_latest_rank_input.csv"),
          ]
          latest_time = None
          for path in candidates:
              if not path.exists():
                  continue
              with path.open("r", encoding="utf-8-sig", newline="") as handle:
                  for row in csv.DictReader(handle):
                      if row.get("trade_date") != today:
                          continue
                      raw_time = (row.get("update_time") or "").strip()
                      if not raw_time:
                          continue
                      try:
                          parsed = datetime.strptime(raw_time, "%Y%m%d %H:%M:%S")
                      except ValueError:
                          continue
                      if latest_time is None or parsed > latest_time:
                          latest_time = parsed
              if latest_time is not None:
                  break

          if latest_time is not None:
              age_minutes = (now.replace(tzinfo=None) - latest_time).total_seconds() / 60
              if age_minutes < fresh_minutes:
                  print(f"Skip because WP data is fresh: latest={latest_time:%Y-%m-%d %H:%M:%S}, age={age_minutes:.1f}m < {fresh_minutes:.1f}m")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                      handle.write("RUN_WP=0\n")
                  raise SystemExit(0)
          print(f"Run window ok by Tushare trade_cal: {now:%Y-%m-%d %H:%M:%S}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("RUN_WP=1\n")
          PY
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_FRESH_MINUTES: "8"
      - name: Refresh Tushare realtime source
        if: env.RUN_WP != '0'
        run: python scripts/fetch_daily_snapshots.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          REALTIME_MINUTE_ONLY: "1"
          ENABLE_MARKET_MINUTE_SCAN: "1"
          TRY_FULL_MARKET_MINUTE: "0"
          REALTIME_QUOTE_CHUNK_SIZE: "300"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "6000"
      - name: Build WP data chain
        if: env.RUN_WP != '0'
        run: python scripts/wp/wp_pipeline.py
      - name: Commit WP data through GitHub API
        if: env.RUN_WP != '0'
        run: python scripts/wp/github_commit_paths.py "Update WP data" data/wp data/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
