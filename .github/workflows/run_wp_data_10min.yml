name: Run WP Data 10min

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fetch_daily_snapshots.py
      - scripts/wp/wp_pipeline.py
      - .github/workflows/run_wp_data_10min.yml
  schedule:
    - cron: "*/10 * * * 1-5"

permissions:
  contents: write

jobs:
  wp-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize run flag
        run: echo "RUN_WP=1" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check A-share run window
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          import tushare as ts

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.strftime("%Y%m%d")
          in_time = time(9, 25) <= now.time() <= time(11, 35) or time(12, 55) <= now.time() <= time(15, 10)

          ts.set_token(os.environ["TUSHARE_TOKEN"])
          pro = ts.pro_api()
          cal = pro.trade_cal(exchange="SSE", start_date=today, end_date=today)
          in_day = bool(len(cal) and int(cal.iloc[0].get("is_open", 0)) == 1)

          if not (in_day and in_time):
              print(f"Skip outside A-share trading calendar/window: {now:%Y-%m-%d %H:%M:%S}, in_day={in_day}, in_time={in_time}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("RUN_WP=0\n")
              raise SystemExit(0)
          print(f"Run window ok by Tushare trade_cal: {now:%Y-%m-%d %H:%M:%S}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("RUN_WP=1\n")
          PY
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Refresh Tushare realtime source
        if: env.RUN_WP != '0'
        run: python scripts/fetch_daily_snapshots.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          REALTIME_MINUTE_ONLY: "1"
          ENABLE_MARKET_MINUTE_SCAN: "1"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "6000"
      - name: Build WP data chain
        if: env.RUN_WP != '0'
        run: python scripts/wp/wp_pipeline.py
      - name: Commit WP data through GitHub API
        if: env.RUN_WP != '0'
        run: python scripts/wp/github_commit_paths.py "Update WP data" data/wp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
