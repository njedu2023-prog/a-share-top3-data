name: Run WP Data 10min

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 1-7 * * 1-5"

permissions:
  contents: write

jobs:
  wp-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check A-share run window
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          in_day = now.weekday() < 5
          in_time = time(9, 25) <= now.time() <= time(11, 35) or time(12, 55) <= now.time() <= time(15, 10)
          if not (in_day and in_time):
              print(f"Skip outside A-share run window: {now:%Y-%m-%d %H:%M:%S}")
              with open(__import__("os").environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("RUN_WP=0\n")
              raise SystemExit(0)
          print(f"Run window ok: {now:%Y-%m-%d %H:%M:%S}")
          with open(__import__("os").environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("RUN_WP=1\n")
          PY
      - name: Install dependencies
        if: env.RUN_WP != '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build WP data chain
        if: env.RUN_WP != '0'
        run: python scripts/wp/wp_pipeline.py
      - name: Commit WP data through GitHub API
        if: env.RUN_WP != '0'
        run: python scripts/wp/github_commit_paths.py "Update WP data" data/wp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
