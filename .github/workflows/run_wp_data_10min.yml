name: Run WP Data Updates

on:
  # WP-specific automatic and push-triggered runs paused 2026-08-14 by user request.
  # Deliberate one-off runs remain available from the Actions UI.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "once"
        type: choice
        options:
          - once
          - due
          - session

permissions:
  contents: write

concurrency:
  group: wp-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest due data slot
        id: due
        run: python scripts/wp/check_wp_data_due.py
        env:
          WP_DATA_RUN_MODE: ${{ github.event_name == 'schedule' && 'due' || github.event_name == 'push' && 'once' || github.event.inputs.mode || 'once' }}
          WP_SCHEDULE_GRACE_SECONDS: "600"
      - uses: actions/setup-python@v6
        if: steps.due.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.due.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run WP data update
        if: steps.due.outputs.should_run == 'true'
        run: python scripts/wp/run_wp_data_session.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ENABLE_AUCTION: "1"
          ENABLE_MINUTE: "1"
          REALTIME_MINUTE_ONLY: "1"
          ENABLE_MARKET_MINUTE_SCAN: "1"
          TRY_FULL_MARKET_MINUTE: "0"
          REALTIME_QUOTE_CHUNK_SIZE: "300"
          MINUTE_FREQ: "1min"
          MAX_MINUTE_SYMBOLS: "6000"
          WP_INTRADAY_MIN_PCT: "8"
          WP_DATA_RUN_MODE: ${{ github.event_name == 'schedule' && 'due' || github.event_name == 'push' && 'once' || github.event.inputs.mode || 'once' }}
          WP_TARGET_SLOT: ${{ steps.due.outputs.target_slot }}
          WP_SCHEDULE_GRACE_SECONDS: "600"
          WP_TRIGGER_REPO: "njedu2023-prog/WP"
          WP_TRIGGER_TOKEN: ${{ secrets.WP_TRIGGER_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN }}
